name: RideLink Microservices CI Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    name: Build & Verify Microservices
    runs-on: ubuntu-latest

    strategy:
      matrix:
        service:
          - account-service
          - driver-service
          - ride-service
          - fare-service

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build and Test Service (${{ matrix.service }})
        run: |
          mvn --batch-mode --errors --fail-at-end clean test -pl ${{ matrix.service }} -am

      - name: Publish Test Results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        with:
          files: "${{ matrix.service }}/target/surefire-reports/*.xml"
